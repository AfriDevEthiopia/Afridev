name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      # gh handles both issues and pull requests (the previous action only understood issues)
      - name: Assign to kika1s1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          KIND: ${{ github.event_name == 'issues' && 'issue' || 'pr' }}
        run: gh "$KIND" edit "$NUMBER" --repo "$REPO" --add-assignee kika1s1
